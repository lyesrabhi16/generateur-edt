version: "3"
services:
  postgres:
    image: agemp-postgres:1.0
    restart: always
    environment:
      POSTGRES_DB: ${DBName}
      POSTGRES_USER: ${DBUser}
      POSTGRES_PASSWORD: ${DBPass}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - 9000:5432

  pgadmin4:
    image: elestio/pgadmin:${SOFTWARE_VERSION_TAG}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - 8080:8080
    depends_on:
      - postgres

  agemp-backend:
    image: agemp-server:1.0
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - postgres
    env_file:
      - agemp-backend.env

  agemp-frontend:
    image: agemp-frontend:1.0
    restart: always
    ports:
      - 5000:5000
    depends_on:
      - agemp-backend
