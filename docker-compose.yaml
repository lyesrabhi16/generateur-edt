    version: '3'
    services:

      postgres:
          image: agemp-postgres:1.0
          restart: always
          environment:
            POSTGRES_DB: ${DBName}
            POSTGRES_USER: ${DBUser}
            POSTGRES_PASSWORD: ${DBPass}
          volumes:
              - ./pgdata:/var/lib/postgresql/data
          ports:
            - 9000:5432

      pgadmin4:
          image: elestio/pgadmin:${SOFTWARE_VERSION_TAG}
          restart: always
          environment:
            PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
            PGADMIN_LISTEN_PORT: 8080
          ports:
            - 8080:8080
          depends_on:
            - postgres
      
      agemp-backend:
        image: agemp-server:1.0
        restart: always
        ports:
          - 3000:3000
        depends_on:
          - postgres
        environment:
          ServerPort: "3000"
          DBHost: "postgres"
          DBPort: "5432"
          DBName: "agemp_db_local"
          DBUser: "admin"
          DBPass: "admin"
          JWTSecret: "d441adbf12e23ea4be6e680ec7160abb1194b313d210e9297b3b1ec10c23af58"
          GOOGLE_CLIENT_ID: "148373478842-lab6hq5l2piurkludiu36158p6tm0mah.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "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"
          GOOGLE_REDIRECT_URI_SEND_EMAIL: "http://localhost:3000/email/auth/google/callback"
      
      agemp-frontend:
          image: agemp-frontend:1.0
          restart: always
          ports:
            - 5000:5000
          depends_on:
            - agemp-backend