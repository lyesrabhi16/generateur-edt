services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DBName:-agemp}
      POSTGRES_USER: ${DBUser:-admin}
      POSTGRES_PASSWORD: ${DBPass:-admin}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # run once, on first start with an empty volume
      - ./autres/DB/creation_agemp_db.sql:/docker-entrypoint-initdb.d/01-creation.sql:ro
      # - ./autres/DB/data_agemp_db.sql:/docker-entrypoint-initdb.d/02-data.sql:ro  # optional sample data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUser:-admin} -d ${DBName:-agemp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ServerPort: 3000
      DBHost: db
      DBPort: 5432
      DBName: ${DBName:-agemp}
      DBUser: ${DBUser:-admin}
      DBPass: ${DBPass:-admin}
      JWTSecret: ${JWTSecret:?set JWTSecret in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5000}
    depends_on:
      - backend
    ports:
      - "5000:80"

volumes:
  pgdata:
